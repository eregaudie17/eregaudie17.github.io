<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="../images/icon_site4.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/style.css" rel="stylesheet" />
    <title>Projet - Emmanuel Regaudie</title>
  </head>
  <body class="bg-midnight-violet text-linen font-family-ffbody">
    <header class="sticky top-0 bg-dark shadow-md z-50">
      <nav
        class="max-w-full mx-auto sm:mx-20 px-4 py-4 flex justify-between items-center"
      >
        <h1 class="text-xl sm:text-3xl font-bold text-linen">
          <a href="/" class="hover:text-slate-blue transition">Emmanuel Regaudie</a>
        </h1>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12 sm:py-20">
      <!-- Back Button -->
      <a href="../" class="inline-flex items-center text-soft-periwinkle hover:text-slate-blue hover:-translate-x-3.5 transition mb-8">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path>
        </svg>
        Retour aux projets
      </a>

      <!-- Project Content -->
      <div class="bg-soft-periwinkle rounded-lg shadow-lg overflow-hidden">
        <img src="../public/images/Covers/BAL_App.png   " alt="Projet Application Musée BAL" class="w-full h-96 object-cover" />
        
        <div class="p-8 text-midnight-violet">
          <h1 class="text-4xl font-bold">Application Musée BAL</h1>
          <p class=" text-lg mb-6">2026 - Projet Universitaire</p>
          
          <div class="mb-8">
            <h3 class="text-2xl font-bold  mb-4">Techniques & Outils</h3>
            <div class="flex flex-wrap gap-2">
              <span class="bg-midnight-violet text-linen px-4 py-2 rounded-lg">Figma</span>
              <span class="bg-midnight-violet text-linen px-4 py-2 rounded-lg">Adobe After Effects</span>
              <span class="bg-midnight-violet text-linen px-4 py-2 rounded-lg">Adobe Premiere Pro</span>
              <span class="bg-midnight-violet text-linen px-4 py-2 rounded-lg">Trello</span>
            </div>
          </div>

          <h3 class="text-2xl font-bold mb-4">Déroulé</h3>
          <p class="text-lg leading-relaxed mb-8">
            Lorem Ipsum
          </p>

          

        </div>
      </div>
    </main>

    <footer class="bg-dark text-white py-8 text-center mt-12">
      <p>&copy; 2025 Emmanuel Regaudie. Tous droits réservés.</p>
    </footer>

    <script>
      // Mobile menu toggle
      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          mobileMenu.classList.toggle("hidden");
        });
      }

      // Close menu when a link is clicked
      const mobileLinks = mobileMenu.querySelectorAll("a");
      mobileLinks.forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
        });
      });
    </script>
  </body>
</html>
